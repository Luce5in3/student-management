server:
  port: 8080
  servlet:
    context-path: /api

spring:
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://112.125.121.32:3306/student_management_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  # Redis配置
  data:
    redis:
      host: 112.125.121.32
      port: 6379
      password: root
      database: 2
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

# JWT配置
jwt:
  # JWT加解密使用的密钥
  secret: f4e2e52034348f86b67cde581c0f9eb5
  # JWT的有效期(单位:秒)
  expire: 86400
  # JWT存储在请求头中的名称
  header: Authorization
  # JWT前缀
  tokenPrefix: Bearer

# Knife4j配置
knife4j:
  enable: true
  setting:
    language: zh-CN
    swagger-model-name: 实体类列表
    enable-swagger-models: true
    enable-document-manage: true
    enable-home-custom: true
    enable-footer: false
    enable-footer-custom: true
    enable-host: false
    enable-host-text: http://localhost:${server.port}${server.servlet.context-path}
    enable-request-cache: true
    enable-search: true
    enable-debug: true
    enable-open-api: true
    enable-group: true
  production: false
  basic:
    enable: false
  documents:
    - group: default
      name: 接口说明文档
      locations: classpath:markdown/*

# 文件上传配置
file:
  upload:
    path: E:/Work/Code/JAVAProjects/student-management/dev/src/main/resources/static/uploads
  access:
    path: /uploads

# 日志配置
logging:
  config: classpath:logback-spring.xml
  level:
    org.springframework.security: INFO
    com.example.student: DEBUG
    org.springframework.web: DEBUG
    org.springframework: WARN
    org.mybatis: DEBUG

# 默认头像配置
default:
  avatar:
    url: /api/uploads/avatar/default/default.jpg
